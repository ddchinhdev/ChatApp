spring.application.name=chatapp-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT - change this secret for a real deployment
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.demo-seed.user-password=${DEMO_USER_PASSWORD:}
app.demo-seed.admin-password=${DEMO_ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html

spring.jackson.time-zone=UTC
