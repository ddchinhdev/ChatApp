spring.application.name=chatapp-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/chatapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT - change this secret for a real deployment
app.jwt.secret=ChatAppDevSecretKeyChangeThisToARealLongRandomSecretKey2026
app.jwt.expiration-ms=86400000

spring.jackson.time-zone=Asia/Ho_Chi_Minh
